name: CI

on: [pull_request]

# A new push supersedes the run before it.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: 24

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: ⚙️ Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: 🕸️ Install Dependencies
      run: npm ci
    - name: 🖌️ Lint
      run: npm run lint
    - name: 🧩 Typecheck
      run: npm run typecheck
    - name: 🧪 Spec
      run: npm run test.spec
    # Lint formats files in place, so a diff means the branch was pushed unformatted.
    - name: 🔍 Check Diff
      run: git diff --exit-code
      shell: bash

  e2e:
    name: E2E
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
    - name: ⚙️ Use Node.js
      uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: npm
    - name: 🕸️ Install Dependencies
      run: npm ci
    - name: 📦 Install Playwright Browsers
      run: npx playwright install chromium
    - name: 🧪 E2E
      run: npm run test.e2e
    # The HTML report is the useful part of a failure, so it is kept for download.
    - name: 📦 Archive Playwright Report
      if: ${{ failure() }}
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
      with:
        name: playwright-report
        path: playwright-report/
        retention-days: 7

  verify:
    # The one required check, so the jobs above can change without touching the
    # protection rules. Renaming this blocks merges until those rules match.
    name: Verify
    if: ${{ always() }}
    needs: [checks, e2e]
    runs-on: ubuntu-latest

    steps:
    - name: Check job status
      if: ${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}
      run: exit 1
